<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <title>JavaPrepTracker — Java DSA Placement Dashboard</title>
    <meta
      name="description"
      content="Offline-first placement preparation dashboard and daily task tracker for Java DSA students."
    />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JavaPrep" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Inline splash so the very first paint is on-brand (FCP < 1.5s) */
      html, body { margin: 0; background: #1a1a2e; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 80% at 50% 0%, #1f2b47 0%, #1a1a2e 55%);
        z-index: 9999; transition: opacity .35s ease;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #splash .cup {
        font-size: 64px; line-height: 1;
        filter: drop-shadow(0 12px 28px rgba(248, 152, 32, .35));
        animation: bob 1.6s ease-in-out infinite;
      }
      #splash .t1 { color: #e2e8f0; font-weight: 800; letter-spacing: -0.02em; font-size: 22px; }
      #splash .t2 { color: #94a3b8; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; }
      #splash .bar { width: 132px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 99px;
        background: linear-gradient(90deg, #00d4aa, #f89820); animation: slide 1.1s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
      @keyframes slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(320%) } }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="cup">☕</div>
      <div class="t1">JavaPrepTracker</div>
      <div class="t2">Java DSA · Placement Prep</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
